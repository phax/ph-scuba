# Messages of the libraries used by the command line client: warnings and errors only, on stderr
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false

# Never log HTTP headers or wire data, even with a debug log level, because they contain the
# credentials of the repository (e.g. the "Authorization" header)
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.headers=info
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.wire=info
